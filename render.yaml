services:
  - type: web
    name: snapbook-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    buildFilter:
      paths:
        - api/**
      ignoredPaths:
        - api/README.md
        - api/**/*.spec.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_DB_SCHEMA
        value: slipsum
      - key: AUTH_REQUIRE_EMAIL_CONFIRM
        value: "false"
      - key: FRONTEND_URL
        value: "https://chiloper.github.io"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        value: "*"
